site_name: Wiki Once Human PS5
site_description: Wiki communautaire francophone dédié à Once Human sur PlayStation 5 / PS5 Pro
site_url: https://flav92.github.io/once-human-ps5-wiki/
repo_url: https://github.com/flav92/once-human-ps5-wiki
repo_name: flav92/once-human-ps5-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
  icon:
    repo: fontawesome/brands/github
    logo: material/sword-cross
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Accueil: index.md
  - Démarrage:
      - Installation et premier lancement: demarrage/installation.md
      - Liaison de compte: demarrage/liaison-compte.md
      - Crossplay et cross-progression: demarrage/crossplay.md
  - Spécifique PS5:
      - Performances (PS5 / PS5 Pro): ps5/performances.md
      - Manette DualSense et contrôles: ps5/manette-et-controles.md
      - Serveurs et régions: ps5/serveurs.md
      - Problèmes connus: ps5/problemes-connus.md
  - Survie:
      - Premiers pas sur Nalcott: jeu/premiers-pas.md
      - Astuces de survie: jeu/astuces-survie.md
      - Multijoueur, PvP et phases: jeu/multijoueur-pvp.md
  - Craft:
      - Ressources — où trouver quoi: jeu/ressources.md
      - Explosifs et munitions: craft/explosifs.md
      - Builds, combos et compétences: craft/builds.md
      - Armes et équipement: jeu/armes-equipement.md
      - Base et territoire: jeu/base-territoire.md
  - Guerre & territoires:
      - Factions armées et Ruches: guerre/factions.md
      - Prendre une zone d'affrontements: guerre/prise-de-zone.md
      - Guerres de frontières et enchères: guerre/frontieres.md
      - GvG — par où commencer: jeu/conquete-bastion.md
  - Glossaire FR/EN: glossaire.md
  - Contribuer:
      - Comment contribuer: contribuer.md
      - 📸 Captures à faire: captures-a-faire.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr

copyright: Wiki non officiel, sans affiliation avec NetEase / Starry Studio.
